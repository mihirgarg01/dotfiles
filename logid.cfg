devices: ({
  name: "MX Master 3 for Business";
  smartshift: { on: true; threshold: 15; };
  hiresscroll: { hires: false; invert: false; target: false; };
  dpi: 1600;

  buttons: ({
    cid: 0xc3;   # thumb gesture button
    action = {
      type: "Gestures";
      gestures: (
        { direction: "Left";  mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEUP"]; }; },
        { direction: "Right"; mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"]; }; },
        { direction: "Up";    mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
	{ direction: "Down";  mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_F10"]; }; },
	{ direction: "None";  mode: "OnRelease";
          action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_ESC"]; }; }
      );
    };
  });
});
